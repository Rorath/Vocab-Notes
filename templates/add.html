<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ "Edit Word" if word else "Add Word" }} · Vocab Notes</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <nav>
        <h1>Vocab Notes</h1>
        <div class="nav-links">
            <a href="{{ url_for('index') }}">My Words</a>
            <a href="{{ url_for('add') }}" class="active">+ Add Word</a>
            <a href="{{ url_for('learn') }}">Learn</a>
        </div>
    </nav>

    <main>
        <div class="form-wrap">
            <h2>{{ "Edit Word" if word else "Add a New Word" }}</h2>
            <form method="POST" action="{{ url_for('edit', word_id=word.id) if word else url_for('add') }}">
                <label>
                    Word
                    <input type="text" name="word" value="{{ word.word if word else '' }}" required autofocus>
                </label>
                <label>
                    English Definition
                    <textarea name="english_def" rows="2" required>{{ word.english_def if word else '' }}</textarea>
                </label>
                <label>
                    Ch Definition <span class="optional">(optional, Traditional Chinese)</span>
                    <textarea name="chinese_def" rows="2">{{ word.chinese_def if word else '' }}</textarea>
                </label>
                <label>
                    Group / Category <span class="optional">(optional — topic or source)</span>
                    <input type="text" name="category" list="cat-list" placeholder="e.g. TOEFL, News, Business"
                           value="{{ word.category if word and word.category else '' }}">
                    <datalist id="cat-list">
                        {% for c in categories %}<option value="{{ c }}">{% endfor %}
                    </datalist>
                </label>
                <label>
                    Example Sentence <span class="optional">(optional)</span>
                    <textarea name="sentence" rows="3">{{ word.sentence if word else '' }}</textarea>
                </label>
                <div class="form-actions">
                    <a href="{{ url_for('index') }}" class="btn-secondary">Cancel</a>
                    <button type="submit" class="btn-primary">{{ "Save Changes" if word else "Add Word" }}</button>
                </div>
            </form>
        </div>
    </main>

    {% include 'mascot.html' %}
    <script src="{{ url_for('static', filename='main.js') }}"></script>
</body>
</html>
