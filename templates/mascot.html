<div class="mascot" id="mascot" title="Hi! I'm Clau, your study buddy">
    <div class="mascot-bubble" id="mascot-bubble"></div>
    <svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <defs>
            <radialGradient id="mascotGlow" cx="50%" cy="50%" r="50%">
                <stop offset="0%" stop-color="#ff9d6b" stop-opacity="0.55"/>
                <stop offset="100%" stop-color="#ff9d6b" stop-opacity="0"/>
            </radialGradient>
        </defs>
        <circle cx="60" cy="62" r="56" fill="url(#mascotGlow)"/>
        <!-- body -->
        <path class="mascot-body" d="M60 20 C 84 20, 98 40, 98 63 C 98 88, 81 102, 60 102 C 39 102, 22 88, 22 63 C 22 40, 36 20, 60 20 Z" fill="#cc785c"/>
        <!-- little antenna spark -->
        <line x1="60" y1="20" x2="60" y2="8" stroke="#ff9d6b" stroke-width="3" stroke-linecap="round"/>
        <circle class="mascot-spark" cx="60" cy="7" r="4" fill="#22d3ee"/>
        <!-- cheeks -->
        <circle cx="41" cy="72" r="6" fill="#ff9d6b" opacity="0.5"/>
        <circle cx="79" cy="72" r="6" fill="#ff9d6b" opacity="0.5"/>
        <!-- eyes -->
        <g class="mascot-eyes">
            <circle cx="47" cy="58" r="7.5" fill="#2a1a12"/>
            <circle cx="73" cy="58" r="7.5" fill="#2a1a12"/>
            <circle cx="49" cy="55" r="2.6" fill="#fff"/>
            <circle cx="75" cy="55" r="2.6" fill="#fff"/>
        </g>
        <!-- smile -->
        <path class="mascot-smile" d="M49 76 Q 60 85, 71 76" stroke="#2a1a12" stroke-width="3.2" fill="none" stroke-linecap="round"/>
    </svg>
</div>
