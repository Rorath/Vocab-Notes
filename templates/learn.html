<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learn · Vocab Notes</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <nav>
        <h1>Vocab Notes</h1>
        <div class="nav-links">
            <a href="{{ url_for('index') }}">My Words</a>
            <a href="{{ url_for('add') }}">+ Add Word</a>
            <a href="{{ url_for('learn') }}" class="active">Learn</a>
        </div>
    </nav>

    <main>
        {% if words %}
        <div class="learn-wrap">
            <div class="progress">
                <span id="current-index">1</span> / <span id="total">{{ words|length }}</span>
            </div>

            <div class="flashcard" id="flashcard">
                <div class="flashcard-inner">
                    <div class="flashcard-front">
                        <p class="hint">Click to reveal</p>
                        <h2 id="card-word"></h2>
                    </div>
                    <div class="flashcard-back">
                        <div class="def-block">
                            <span class="label">English</span>
                            <p id="card-english"></p>
                        </div>
                        <div class="def-block">
                            <span class="label">中文</span>
                            <p id="card-chinese"></p>
                        </div>
                        <div class="def-block sentence" id="sentence-block">
                            <span class="label">Example</span>
                            <p id="card-sentence"></p>
                        </div>
                    </div>
                </div>
            </div>

            <div class="learn-controls">
                <button id="prev-btn" class="btn-secondary">← Prev</button>
                <button id="shuffle-btn" class="btn-secondary">Shuffle</button>
                <button id="known-btn" class="btn-known">✓ I knew it!</button>
                <button id="next-btn" class="btn-primary">Next →</button>
            </div>
        </div>

        <script>
            const WORDS = {{ words_json|safe }};
        </script>
        {% else %}
        <div class="empty">
            <p>No words to learn yet.</p>
            <a href="{{ url_for('add') }}" class="btn-primary">Add your first word</a>
        </div>
        {% endif %}
    </main>

    {% include 'mascot.html' %}
    <script src="{{ url_for('static', filename='main.js') }}"></script>
</body>
</html>
